name: schema-secret-gate

on:
  pull_request:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: secret scan + schema/OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: git diff --check
        run: git diff --check

      - name: Repository secret/canary scan
        run: scripts/ci/secret_scan.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Workflow syntax validation (yamllint)
        run: |
          python -m pip install --upgrade pip yamllint
          yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable}}' .github/workflows

      - name: OpenAPI / generated-client drift (locked)
        run: |
          pip install -c constraints.txt -e .
          python scripts/gen_openapi.py
          (cd frontend && npm ci && npm run generate:client)
          if ! git diff --exit-code -- frontend/src/generated/openapi.json frontend/src/generated/schema.d.ts; then
            echo "::error::Generated OpenAPI/client drift detected."
            exit 1
          fi
