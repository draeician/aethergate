name: beta-release-gate

on:
  pull_request:
  push:
    branches: [v2, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Beta 1 production-policy release gate (disposable)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies (locked)
        # Only what scripts/ci/beta_smoke.py + golden_path helpers need on the
        # runner: httpx (admin calls) and openai (official SDK). cryptography is
        # used by the gate script to generate the disposable Fernet queue key.
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt httpx openai cryptography

      - name: Run Beta 1 production-policy release gate
        # Builds the isolated prod image, starts the disposable beta1 profile with
        # the literal-IP fake upstream, proves migration + prod config_check VALID
        # + SDK smoke + worker restart recovery + backup/restore + post-restore
        # SDK, then tears down only its own project. Never downloads a model.
        run: bash scripts/ci/beta_release_gate.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          if [[ ! -f /tmp/ag-beta1-smoke/env/.env ]]; then
            echo "beta smoke workdir absent; nothing to log (failed before stack start)"
            exit 0
          fi
          docker compose --project-name ag-beta1-smoke \
            --project-directory deploy/beta1 \
            --env-file /tmp/ag-beta1-smoke/env/.env \
            -f deploy/beta1/compose.yaml -f deploy/beta1/compose.smoke.yaml \
            logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: |
          if [[ ! -f /tmp/ag-beta1-smoke/env/.env ]]; then
            echo "beta smoke workdir absent; nothing to tear down"
            exit 0
          fi
          docker compose --project-name ag-beta1-smoke \
            --project-directory deploy/beta1 \
            --env-file /tmp/ag-beta1-smoke/env/.env \
            -f deploy/beta1/compose.yaml -f deploy/beta1/compose.smoke.yaml \
            down -v || true
