name: frontend

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python (for OpenAPI generation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: npm ci
        run: npm ci

      - name: Unit/component tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: OpenAPI + generated-client drift check (locked)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .
          python scripts/gen_openapi.py
          (cd frontend && npm run generate:client)
          if ! git diff --exit-code -- frontend/src/generated/openapi.json frontend/src/generated/schema.d.ts; then
            echo "::error::Generated OpenAPI/client drift detected. Run scripts/gen_openapi.py and npm run generate:client."
            exit 1
          fi
