server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — let React Router handle all paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The gateway holds non-stream requests synchronously while a queued
        # request waits for admission and while the upstream model generates
        # (no bytes are flushed until the terminal result). The nginx default
        # proxy_read_timeout (60s) cuts those long-held connections with a 504
        # before slow upstream inference completes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
